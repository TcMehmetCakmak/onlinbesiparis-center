<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Yükleniyor...</title>
    <!-- Universal tenant loader: gallery-v2 / 2026-09-29 -->
</head>
<body>
    <div style="font-family:Arial,sans-serif;padding:24px;text-align:center">
        Uygulama yükleniyor...
    </div>

    <script>
    (async function () {
        try {
            const parts = location.pathname
                .split("/")
                .filter(Boolean);

            const slug = String(
                parts[parts.length - 1] || ""
            ).trim().toLowerCase();

            if (!slug || slug === "index.html") {
                throw new Error("Tenant slug URL'den okunamadı.");
            }

            /*
             * Uygulamanın tenant'ı kesin olarak algılaması için
             * geçici olarak query parametresi ekliyoruz.
             *
             * /ceyiz-sandigi/
             *      ↓
             * /ceyiz-sandigi/?tenant=ceyiz-sandigi
             *
             * Ana uygulamadaki usePrettyTenantUrl() bunu tekrar
             * temiz /ceyiz-sandigi/ adresine çevirir.
             */
            const currentUrl = new URL(location.href);
            currentUrl.searchParams.set("tenant", slug);

            history.replaceState(
                history.state,
                "",
                currentUrl.pathname + currentUrl.search + currentUrl.hash
            );

            const rootIndexUrl = new URL("../index.html", location.href);
            rootIndexUrl.searchParams.set("v", "20261008-durumcu-menu-v1");

            const response = await fetch(rootIndexUrl.href, {
                cache: "no-store",
                headers: {
                    "Cache-Control": "no-cache"
                }
            });

            if (!response.ok) {
                throw new Error(
                    "Ortak index.html yüklenemedi. HTTP " +
                    response.status
                );
            }

            let html = await response.text();

            /*
             * Root uygulamada asset base "./".
             * Tenant altında root assetlerine "../" ile ulaşılır.
             */
            html = html.replace(
                /<base\s+href=["']\.\/["']\s*\/?>/i,
                '<base href="../">'
            );

            document.open();
            document.write(html);
            document.close();

        } catch (error) {
            console.error(
                "Tenant uygulaması yüklenemedi:",
                error
            );

            document.body.innerHTML = `
                <div style="
                    font-family:Arial,sans-serif;
                    max-width:560px;
                    margin:60px auto;
                    padding:24px;
                    text-align:center
                ">
                    <h2>Uygulama yüklenemedi</h2>
                    <p>
                        ${String(error.message || error)}
                    </p>
                    <button
                        onclick="location.reload()"
                        style="
                            padding:10px 18px;
                            border:0;
                            border-radius:8px;
                            cursor:pointer
                        "
                    >
                        Yenile
                    </button>
                </div>
            `;
        }
    })();
    </script>
</body>
</html>
