<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Yükleniyor...</title>
</head>
<body>
    <div style="font-family:Arial,sans-serif;padding:24px;text-align:center">
        Uygulama yükleniyor...
    </div>

    <script>
    (async function () {
        try {
            const response = await fetch("../index.html", {
                cache: "no-store"
            });

            if (!response.ok) {
                throw new Error(
                    "Ortak index.html yüklenemedi. HTTP " + response.status
                );
            }

            let html = await response.text();

            // Root index.html'de asset yolu "./".
            // Tenant URL'sinde çalışırken root assetlerine "../" üzerinden erişmeliyiz.
            html = html.replace(
                '<base href="./">',
                '<base href="../">'
            );

            document.open();
            document.write(html);
            document.close();
        } catch (error) {
            console.error("Tenant uygulaması yüklenemedi:", error);

            document.body.innerHTML = `
                <div style="
                    font-family:Arial,sans-serif;
                    max-width:560px;
                    margin:60px auto;
                    padding:24px;
                    text-align:center
                ">
                    <h2>Uygulama yüklenemedi</h2>
                    <p>Lütfen internet bağlantınızı kontrol edip sayfayı yenileyin.</p>
                    <button
                        onclick="location.reload()"
                        style="
                            padding:10px 18px;
                            border:0;
                            border-radius:8px;
                            cursor:pointer
                        "
                    >
                        Yenile
                    </button>
                </div>
            `;
        }
    })();
    </script>
</body>
</html>
