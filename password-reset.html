<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şifre Sıfırlama | Online Sipariş</title>
    
    <link rel="icon" href="icon-192.png">

    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: #f5f5f5; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
        }
        .card { 
            background: #fff; 
            padding: 35px; 
            border-radius: 20px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.08); 
            width: 100%; 
            max-width: 420px; 
            text-align: center; 
        }
        h2 { 
            margin-top: 0; 
            margin-bottom: 24px; 
            color: #222; 
        }
        label { 
            display: block; 
            text-align: left; 
            margin-bottom: 8px; 
            font-weight: 700; 
            color: #444; 
            font-size: 14px;
        }
        input[type="password"] { 
            width: 100%; 
            padding: 14px; 
            margin-bottom: 20px; 
            border: 1px solid #ddd; 
            border-radius: 12px; 
            box-sizing: border-box; 
            font-size: 16px; 
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="password"]:focus {
            border-color: #222;
        }
        button { 
            width: 100%; 
            padding: 16px; 
            background: #1f7a4d; 
            color: #fff; 
            border: none; 
            border-radius: 12px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: background 0.2s, transform 0.1s; 
        }
        button:hover { 
            background: #17603c; 
        }
        button:active {
            transform: scale(0.98);
        }
        button:disabled {
            background: #999;
            cursor: not-allowed;
            transform: none;
        }
        .message { 
            margin-top: 20px; 
            padding: 14px; 
            border-radius: 12px; 
            display: none; 
            font-size: 14px;
            line-height: 1.5;
        }
        .message.success { 
            background: #e8f5e9; 
            color: #2e7d32; 
            display: block; 
            border: 1px solid #c8e6c9; 
        }
        .message.error { 
            background: #ffebee; 
            color: #c62828; 
            display: block; 
            border: 1px solid #ffcdd2; 
        }
        .loading-text { 
            color: #777; 
            font-size: 16px;
        }
        .logo-placeholder {
            font-size: 32px;
            margin-bottom: 16px;
        }
    </style>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Proje Ayarları (Supabase URL, Key vb.) -->
    <script src="supabase-config.js"></script>
    <script src="platform-config.js"></script>
</head>
<body>

    <div class="card" id="mainCard">
        <div class="logo-placeholder">🔐</div>
        
        <div id="loadingState">
            <h2 class="loading-text">Bağlantı kontrol ediliyor...</h2>
        </div>
        
        <div id="formState" style="display: none;">
            <h2>Yeni Şifrenizi Belirleyin</h2>
            <form id="resetForm">
                <label for="newPassword">Yeni Şifre</label>
                <input type="password" id="newPassword" required minlength="6" placeholder="En az 6 karakter girin">
                
                <label for="confirmPassword">Yeni Şifre (Tekrar)</label>
                <input type="password" id="confirmPassword" required minlength="6" placeholder="Şifrenizi tekrar girin">
                
                <button type="submit" id="submitBtn">Şifreyi Güncelle</button>
            </form>
        </div>

        <div id="messageBox" class="message"></div>
    </div>

    <script>
        // Supabase istemcisini başlat
        const supabaseUrl = window.SUPABASE_CONFIG.url;
        const supabaseKey = window.SUPABASE_CONFIG.key;
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        const loadingState = document.getElementById('loadingState');
        const formState = document.getElementById('formState');
        const resetForm = document.getElementById('resetForm');
        const messageBox = document.getElementById('messageBox');
        const submitBtn = document.getElementById('submitBtn');

        function showMessage(msg, isError = false) {
            messageBox.textContent = msg;
            messageBox.className = 'message ' + (isError ? 'error' : 'success');
            messageBox.style.display = 'block';
        }

        function translateAuthError(msg) {
            const m = String(msg || '');
            if (m.includes('New password should be different from the old password')) {
                return 'Yeni şifreniz eski şifrenizden farklı olmalıdır.';
            }
            if (m.includes('Password should be at least')) {
                return 'Şifreniz en az 6 karakter olmalıdır.';
            }
            if (m.includes('Token has expired or is invalid') || m.includes('Email link is invalid or has expired')) {
                return 'Sıfırlama bağlantısının süresi dolmuş veya geçersiz. Lütfen yeni bir şifre sıfırlama e-postası talep edin.';
            }
            return m || 'Bir hata oluştu.';
        }

        // Supabase Auth durumunu dinle
        supabaseClient.auth.onAuthStateChange((event, session) => {
            console.log("Auth event:", event);
            
            // Kullanıcı e-postadaki linke tıkladığında PASSWORD_RECOVERY veya SIGNED_IN eventi fırlatılır
            if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && window.location.hash.includes('type=recovery'))) {
                loadingState.style.display = 'none';
                formState.style.display = 'block';
            } else if (event === 'SIGNED_IN') {
                // Her halükarda SIGNED_IN olduysa ve token varsa güncelleme formunu aç
                loadingState.style.display = 'none';
                formState.style.display = 'block';
            }
        });

        // Sayfa yüklendiğinde URL kontrolü yap
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const hash = window.location.hash;
                const searchParams = new URLSearchParams(window.location.search);
                const tokenHash = searchParams.get('token_hash');
                const type = searchParams.get('type') || 'recovery';

                // Eğer URL'de ?token_hash=... varsa Supabase ile doğrula
                if (tokenHash) {
                    const { error } = await supabaseClient.auth.verifyOtp({
                        token_hash: tokenHash,
                        type: type
                    });
                    if (error) {
                        loadingState.style.display = 'none';
                        showMessage(translateAuthError(error.message), true);
                    } else {
                        loadingState.style.display = 'none';
                        formState.style.display = 'block';
                    }
                    return;
                }
                
                // Eğer URL'de kurtarma token'ı bulunmuyorsa uyar
                if (!hash.includes('type=recovery') && !hash.includes('access_token')) {
                    loadingState.style.display = 'none';
                    showMessage('Geçersiz veya süresi dolmuş sıfırlama bağlantısı. Lütfen tekrar şifre sıfırlama e-postası talep edin.', true);
                }
            } catch (err) {
                console.error("Doğrulama hatası:", err);
                loadingState.style.display = 'none';
                showMessage(translateAuthError(err.message || err), true);
            }
        });

        // Form gönderimi
        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                showMessage('Şifreler eşleşmiyor. Lütfen kontrol edin.', true);
                return;
            }

            if (newPassword.length < 6) {
                showMessage('Şifreniz en az 6 karakter olmalıdır.', true);
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Güncelleniyor...';
            messageBox.style.display = 'none';

            try {
                // Şifreyi Supabase'de güncelle
                const { data, error } = await supabaseClient.auth.updateUser({
                    password: newPassword
                });

                if (error) throw error;

                formState.style.display = 'none';
                showMessage('Şifreniz başarıyla güncellendi! Yönetim paneline yönlendiriliyorsunuz...');
                
                // Başarılı olduğunda mevcut oturumu temizle ve yönlendir
                await supabaseClient.auth.signOut();
                
                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 2500);

            } catch (err) {
                console.error("Şifre güncelleme hatası:", err);
                showMessage(translateAuthError(err.message), true);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Şifreyi Güncelle';
            }
        });
    </script>

</body>
</html>
