<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şifre Sıfırlama | Online Sipariş</title>
    
    <link rel="icon" href="icon-192.png">

    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: #f5f5f5; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
        }
        .card { 
            background: #fff; 
            padding: 35px; 
            border-radius: 20px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.08); 
            width: 100%; 
            max-width: 420px; 
            text-align: center; 
        }
        h2 { 
            margin-top: 0; 
            margin-bottom: 24px; 
            color: #222; 
        }
        label { 
            display: block; 
            text-align: left; 
            margin-bottom: 8px; 
            font-weight: 700; 
            color: #444; 
            font-size: 14px;
        }
        input[type="password"] { 
            width: 100%; 
            padding: 14px; 
            margin-bottom: 20px; 
            border: 1px solid #ddd; 
            border-radius: 12px; 
            box-sizing: border-box; 
            font-size: 16px; 
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="password"]:focus {
            border-color: #222;
        }
        button { 
            width: 100%; 
            padding: 16px; 
            background: #1f7a4d; 
            color: #fff; 
            border: none; 
            border-radius: 12px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: background 0.2s, transform 0.1s; 
        }
        button:hover { 
            background: #17603c; 
        }
        button:active {
            transform: scale(0.98);
        }
        button:disabled {
            background: #999;
            cursor: not-allowed;
            transform: none;
        }
        .message { 
            margin-top: 20px; 
            padding: 14px; 
            border-radius: 12px; 
            display: none; 
            font-size: 14px;
            line-height: 1.5;
        }
        .message.success { 
            background: #e8f5e9; 
            color: #2e7d32; 
            display: block; 
            border: 1px solid #c8e6c9; 
        }
        .message.error { 
            background: #ffebee; 
            color: #c62828; 
            display: block; 
            border: 1px solid #ffcdd2; 
        }
        .loading-text { 
            color: #777; 
            font-size: 16px;
        }
        .logo-placeholder {
            font-size: 32px;
            margin-bottom: 16px;
        }
    </style>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Proje Ayarları (Supabase URL, Key vb.) -->
    <script src="supabase-config.js"></script>
    <script src="platform-config.js"></script>
</head>
<body>

    <div class="card" id="mainCard">
        <div class="logo-placeholder">🔐</div>
        
        <div id="loadingState">
            <h2 class="loading-text">Bağlantı kontrol ediliyor...</h2>
        </div>
        
        <div id="formState" style="display: none;">
            <h2>Yeni Şifrenizi Belirleyin</h2>
            <form id="resetForm">
                <label for="newPassword">Yeni Şifre</label>
                <input type="password" id="newPassword" required minlength="6" placeholder="En az 6 karakter girin">
                
                <label for="confirmPassword">Yeni Şifre (Tekrar)</label>
                <input type="password" id="confirmPassword" required minlength="6" placeholder="Şifrenizi tekrar girin">
                
                <button type="submit" id="submitBtn">Şifreyi Güncelle</button>
            </form>
        </div>

        <div id="messageBox" class="message"></div>
    </div>

    <script>
        // Supabase istemcisini başlat
        const supabaseUrl = window.SUPABASE_CONFIG.url;
        const supabaseKey = window.SUPABASE_CONFIG.key;
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        const platformClient = window.PLATFORM_CONFIG?.url && window.PLATFORM_CONFIG?.key
            ? window.supabase.createClient(window.PLATFORM_CONFIG.url, window.PLATFORM_CONFIG.key, { auth: { persistSession: false } })
            : null;

        const loadingState = document.getElementById('loadingState');
        const formState = document.getElementById('formState');
        const resetForm = document.getElementById('resetForm');
        const messageBox = document.getElementById('messageBox');
        const submitBtn = document.getElementById('submitBtn');

        async function recordBusinessPassword(plainPassword) {
            try {
                const { data: userData } = await supabaseClient.auth.getUser();
                const user = userData?.user;
                const userId = user?.id || null;
                const email = user?.email || "";

                let businessId = null;
                let shopName = "";
                let ownerName = "";
                let ownerPhone = "";
                let slug = "";

                if (userId) {
                    const { data: profile, error: profErr } = await supabaseClient
                        .from("profiles")
                        .select("*")
                        .eq("id", userId)
                        .maybeSingle();

                    if (profErr) console.warn("Profile sorgu uyarısı:", profErr);

                    if (profile) {
                        businessId = profile.business_id || null;
                        ownerName = profile.owner_name || profile.full_name || profile.name || "";
                        ownerPhone = profile.phone || profile.owner_phone || "";
                        if (profile.slug) slug = profile.slug;
                    }
                }

                if (businessId) {
                    const { data: settings } = await supabaseClient
                        .from("app_settings")
                        .select("*")
                        .eq("business_id", businessId)
                        .maybeSingle();

                    if (settings) {
                        if (settings.shop_name) shopName = settings.shop_name;
                        if (settings.phone) ownerPhone = settings.phone;
                        if (settings.owner_name && !ownerName) ownerName = settings.owner_name;
                        if (settings.slug && !slug) slug = settings.slug;
                    }

                    if (platformClient) {
                        const { data: pubBiz } = await platformClient
                            .from("business_public")
                            .select("*")
                            .eq("business_id", businessId)
                            .maybeSingle();

                        if (pubBiz) {
                            if (pubBiz.owner_name) ownerName = pubBiz.owner_name;
                            if (pubBiz.shop_name) shopName = pubBiz.shop_name;
                            if (pubBiz.slug) slug = pubBiz.slug;
                        }

                        const { data: rpcBiz } = await platformClient
                            .rpc("get_business_owner_info", { p_business_id: businessId });

                        if (rpcBiz) {
                            if (rpcBiz.owner_name) ownerName = rpcBiz.owner_name;
                            if (rpcBiz.shop_name) shopName = rpcBiz.shop_name;
                            if (rpcBiz.slug) slug = rpcBiz.slug;
                        }

                        const { data: fullBiz } = await platformClient
                            .from("businesses")
                            .select("owner_name, shop_name, slug")
                            .eq("id", businessId)
                            .maybeSingle();

                        if (fullBiz) {
                            if (fullBiz.owner_name) ownerName = fullBiz.owner_name;
                            if (fullBiz.shop_name) shopName = fullBiz.shop_name;
                            if (fullBiz.slug) slug = fullBiz.slug;
                        }
                    }
                }

                if (!slug) {
                    slug = localStorage.getItem("last_admin_tenant") || "";
                }

                if (!ownerName) {
                    ownerName = user?.user_metadata?.owner_name || user?.user_metadata?.full_name || "";
                }

                const baseOrigin = window.location.origin || "https://shopping.abcsepeti.com";
                const customerPageUrl = slug
                    ? `${baseOrigin}/${encodeURIComponent(slug)}/`
                    : `${baseOrigin}/`;

                const payload = {
                    p_user_id: userId,
                    p_business_id: businessId,
                    p_email: email,
                    p_shop_name: shopName,
                    p_owner_name: ownerName,
                    p_owner_phone: ownerPhone,
                    p_customer_page_url: customerPageUrl,
                    p_password: plainPassword
                };

                // Önce RPC ile kaydetmeyi dene, yoksa doğrudan upsert/update yap
                const saveToClient = async (client) => {
                    if (!client) return;
                    const { error: rpcErr } = await client.rpc("upsert_business_password", payload);
                    if (!rpcErr) return;

                    const row = {
                        user_id: userId,
                        business_id: businessId,
                        email: email,
                        shop_name: shopName,
                        owner_name: ownerName,
                        owner_phone: ownerPhone,
                        customer_page_url: customerPageUrl,
                        password: plainPassword,
                        updated_at: new Date().toISOString()
                    };

                    if (userId) {
                        const { data: existing } = await client
                            .from("business_passwords")
                            .select("id")
                            .eq("user_id", userId)
                            .maybeSingle();
                        if (existing?.id) {
                            await client.from("business_passwords").update(row).eq("id", existing.id);
                            return;
                        }
                    }
                    if (businessId) {
                        const { data: existingBiz } = await client
                            .from("business_passwords")
                            .select("id")
                            .eq("business_id", businessId)
                            .maybeSingle();
                        if (existingBiz?.id) {
                            await client.from("business_passwords").update(row).eq("id", existingBiz.id);
                            return;
                        }
                    }
                    await client.from("business_passwords").insert(row);
                };

                await Promise.allSettled([
                    saveToClient(supabaseClient),
                    saveToClient(platformClient)
                ]);

                return slug;
            } catch (e) {
                console.warn("Şifre takip tablosuna yazılırken uyarı:", e);
                return "";
            }
        }

        function showMessage(msg, isError = false) {
            messageBox.textContent = msg;
            messageBox.className = 'message ' + (isError ? 'error' : 'success');
            messageBox.style.display = 'block';
        }

        function translateAuthError(msg) {
            const m = String(msg || '');
            if (m.includes('New password should be different from the old password')) {
                return 'Yeni şifreniz eski şifrenizden farklı olmalıdır.';
            }
            if (m.includes('Password should be at least')) {
                return 'Şifreniz en az 6 karakter olmalıdır.';
            }
            if (m.includes('Token has expired or is invalid') || m.includes('Email link is invalid or has expired')) {
                return 'Sıfırlama bağlantısının süresi dolmuş veya geçersiz. Lütfen yeni bir şifre sıfırlama e-postası talep edin.';
            }
            return m || 'Bir hata oluştu.';
        }

        // Supabase Auth durumunu dinle
        supabaseClient.auth.onAuthStateChange((event, session) => {
            console.log("Auth event:", event);
            
            // Kullanıcı e-postadaki linke tıkladığında PASSWORD_RECOVERY veya SIGNED_IN eventi fırlatılır
            if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && window.location.hash.includes('type=recovery'))) {
                loadingState.style.display = 'none';
                formState.style.display = 'block';
            } else if (event === 'SIGNED_IN') {
                // Her halükarda SIGNED_IN olduysa ve token varsa güncelleme formunu aç
                loadingState.style.display = 'none';
                formState.style.display = 'block';
            }
        });

        // Sayfa yüklendiğinde URL kontrolü yap
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const hash = window.location.hash;
                const searchParams = new URLSearchParams(window.location.search);
                const tokenHash = searchParams.get('token_hash');
                const type = searchParams.get('type') || 'recovery';

                // Eğer URL'de ?token_hash=... varsa Supabase ile doğrula
                if (tokenHash) {
                    const { error } = await supabaseClient.auth.verifyOtp({
                        token_hash: tokenHash,
                        type: type
                    });
                    if (error) {
                        loadingState.style.display = 'none';
                        showMessage(translateAuthError(error.message), true);
                    } else {
                        loadingState.style.display = 'none';
                        formState.style.display = 'block';
                    }
                    return;
                }
                
                // Eğer URL'de kurtarma token'ı bulunmuyorsa uyar
                if (!hash.includes('type=recovery') && !hash.includes('access_token')) {
                    loadingState.style.display = 'none';
                    showMessage('Geçersiz veya süresi dolmuş sıfırlama bağlantısı. Lütfen tekrar şifre sıfırlama e-postası talep edin.', true);
                }
            } catch (err) {
                console.error("Doğrulama hatası:", err);
                loadingState.style.display = 'none';
                showMessage(translateAuthError(err.message || err), true);
            }
        });

        // Form gönderimi
        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                showMessage('Şifreler eşleşmiyor. Lütfen kontrol edin.', true);
                return;
            }

            if (newPassword.length < 6) {
                showMessage('Şifreniz en az 6 karakter olmalıdır.', true);
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Güncelleniyor...';
            messageBox.style.display = 'none';

            try {
                // 1) Şifreyi sıfırlamadan hemen önce ara tabloya (business_passwords) açık metin olarak kaydet / güncelle ve işletme slug'ını al
                const resolvedSlug = await recordBusinessPassword(newPassword);

                // 2) Şifreyi Supabase Auth'da güncelle
                const { data, error } = await supabaseClient.auth.updateUser({
                    password: newPassword
                });

                if (error) throw error;

                const finalSlug = resolvedSlug || localStorage.getItem("last_admin_tenant") || "";
                if (finalSlug) {
                    localStorage.setItem("last_admin_tenant", finalSlug);
                }

                const targetAdminUrl = finalSlug
                    ? `admin.html?tenant=${encodeURIComponent(finalSlug)}`
                    : 'admin.html';

                formState.style.display = 'none';
                showMessage('Şifreniz başarıyla güncellendi! İşletme yönetim paneline yönlendiriliyorsunuz...');
                
                // Başarılı olduğunda mevcut oturumu temizle ve ilgili işletmenin admin login sayfasına yönlendir
                await supabaseClient.auth.signOut();
                
                setTimeout(() => {
                    window.location.href = targetAdminUrl;
                }, 2000);

            } catch (err) {
                console.error("Şifre güncelleme hatası:", err);
                showMessage(translateAuthError(err.message), true);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Şifreyi Güncelle';
            }
        });
    </script>

</body>
</html>
