<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İşletme Yönetim Paneli</title>
<script>
(function(){
  const t = new URLSearchParams(location.search).get("tenant") || localStorage.getItem("last_admin_tenant") || "demo";
  const name = t.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
  const m = {
    name: name + " Yönetim",
    short_name: name,
    start_url: new URL("/admin.html?tenant=" + encodeURIComponent(t), location.href).href,
    display: "standalone",
    background_color: "#f4f5f7",
    theme_color: "#222222",
    icons: [
      { src: new URL("icon-192.png", location.href).href, sizes: "192x192", type: "image/png", purpose: "any maskable" },
      { src: new URL("icon-512.png", location.href).href, sizes: "512x512", type: "image/png", purpose: "any maskable" }
    ]
  };
  const dataUri = "data:application/manifest+json;charset=utf-8," + encodeURIComponent(JSON.stringify(m));
  document.write('<link rel="manifest" href="' + dataUri + '">');
})();
</script>
<meta name="theme-color" content="#222222">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#222}
button,input,select{font:inherit}
.hidden{display:none!important}
.container{max-width:1180px;margin:auto;padding:24px}
.login{max-width:420px;margin:70px auto;background:#fff;border-radius:18px;padding:28px;box-shadow:0 8px 30px #00000012}
.login-password-wrap{position:relative}
.login-password-wrap input{padding-right:48px}
.login-password-toggle{
  position:absolute;
  right:7px;
  top:50%;
  transform:translateY(-50%);
  width:36px;
  height:36px;
  border:0;
  border-radius:8px;
  background:#f0f1f3;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  font-size:17px;
}
.login-password-toggle:hover{background:#e4e6e9}

h1,h2,h3{margin-top:0}
input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;background:#fff}
label{display:block;margin:12px 0 6px;font-weight:bold}
.btn{border:0;border-radius:10px;padding:11px 15px;cursor:pointer;font-weight:bold}
.btn-primary{background:#e63946;color:#fff}.btn-dark{background:#222;color:#fff}.btn-light{background:#eee}.btn-danger{background:#c62828;color:#fff}.btn-success{background:#2e7d32;color:#fff}
.header{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}
.header-actions{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px;align-items:stretch}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 5px 20px #0000000d}
.stat-label{color:#666;font-size:12.5px;font-weight:600;line-height:1.25;text-align:center;width:100%}
.stat-value{font-size:22px;font-weight:800;margin-top:0;line-height:1.15;text-align:center;color:#111}
.stat-desc{font-size:10.5px;line-height:1.28;margin-top:2px;color:#555;text-align:center}
.grid>.card{position:relative;overflow:hidden;padding:12px 10px;border:1px solid #e5e7eb;box-shadow:none;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:5px;min-height:0}
.stat-card-active-views{background:#f0fdf4;border:1px solid #86efac}
.stat-card-active-views .stat-label{color:#166534;font-weight:700}
.stat-card-active-views .stat-value{color:#15803d;font-size:20px}
.stat-card-inactive-views{background:#fef2f2;border:1px solid #fca5a5;gap:3px}
.stat-card-inactive-views .stat-label{color:#991b1b;font-weight:700}
.stat-card-inactive-views .stat-value{color:#dc2626;font-size:19px}
.stat-card-inactive-views .stat-desc{color:#7f1d1d}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tab{padding:10px 14px;border:0;border-radius:10px;background:#e9eaec;cursor:pointer}.tab.active{background:#222;color:#fff}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.product{border:1px solid #eee;border-radius:14px;padding:15px;display:flex;justify-content:space-between;gap:15px;align-items:center}
.product-left{display:flex;align-items:center;gap:12px}.icon{font-size:32px}.muted{color:#777;font-size:13px}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.form-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
.order{border:1px solid #eee;border-radius:14px;padding:16px;margin-bottom:12px}
.order-head{display:flex;justify-content:space-between;gap:10px;align-items:center}
.badge{padding:5px 9px;border-radius:999px;font-size:12px;font-weight:bold}
.badge-pending{background:#fff2cc;color:#8a5a00}.badge-active{background:#e3f2fd;color:#0d47a1}.badge-done{background:#dff5e3;color:#176b2c}.badge-cancel{background:#ffe1e1;color:#a11}.badge-review{background:#e8e4ff;color:#4c3494}.ticket{border:1px solid #eee;border-radius:14px;padding:16px;margin-bottom:12px}.ticket-detail{white-space:pre-wrap;word-break:break-word;margin-top:10px;line-height:1.5}.ticket-resolution{margin-top:12px;padding:12px;background:#f5f8ff;border-radius:10px}.ticket-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.order-items{margin:12px 0;padding:10px;background:#f8f8f8;border-radius:10px}
.filters{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin-bottom:15px}
.empty{text-align:center;color:#777;padding:30px}
.modal{
  position:fixed;
  inset:0;
  z-index:1000;
  background:#0008;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  overflow-y:auto;
  overflow-x:hidden;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  touch-action:pan-y;
}

.modal-card{
  background:#fff;
  border-radius:16px;
  padding:22px;
  max-width:520px;
  width:100%;
  max-height:calc(100dvh - 40px);
  overflow-y:auto;
  overflow-x:hidden;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  touch-action:pan-y;
}

html.modal-open,
body.modal-open{
  overflow:hidden !important;
  overscroll-behavior:none;
}

body.modal-open{
  position:fixed;
  width:100%;
  left:0;
  right:0;
}

@media(max-width:600px){
  .modal{
    align-items:flex-start;
    padding:10px;
  }

  .modal-card{
    max-width:none;
    max-height:calc(100dvh - 20px);
    border-radius:14px;
    padding:16px;
    margin:0;
  }
}
.toast{position:fixed;right:20px;bottom:20px;background:#222;color:#fff;padding:12px 16px;border-radius:10px;display:none}

.revenue-card{cursor:pointer;transition:transform .15s ease}.revenue-card:hover{transform:translateY(-2px)}
.revenue-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.revenue-box{background:#f7f7f7;border-radius:12px;padding:16px}.revenue-box strong{display:block;font-size:24px;margin-top:6px}
.discount-admin-fields{margin-top:12px;padding:14px;background:#fff7e6;border:1px solid #ffd58a;border-radius:12px}
.pdf-btn{background:#455a64;color:#fff}
@media(max-width:1200px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.grid>.card{padding:8px 8px;border-radius:12px;gap:3px}.stat-label{font-size:11px}.stat-value{font-size:17px}.stat-card-active-views .stat-value,.stat-card-inactive-views .stat-value{font-size:15px}.stat-desc{font-size:9.5px;line-height:1.2}.products{grid-template-columns:1fr}.form-grid,.filters{grid-template-columns:1fr}.container{padding:14px}.header{align-items:flex-start;flex-direction:column}}
@media(max-width:600px){.revenue-grid{grid-template-columns:1fr}}

  display:flex;align-items:center;justify-content:center;
  background:#f2f2f2;border:1px dashed #ccc;
